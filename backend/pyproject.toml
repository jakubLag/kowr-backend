[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-kowr"
version = "1.0.0"
description = "Backend REST API dla projektu KOWR 'Zatrzymaj wodę, chroń plony' (HackNation 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "jinja2>=3.1.3",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

